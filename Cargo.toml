[workspace]
members = [
    "apps/desktop",
    "crates/app-services",
    "crates/connection-pool",
    "crates/connection-store",
    "crates/core-domain",
    "crates/driver-api",
    "crates/driver-mongodb",
    "crates/driver-mysql",
    "crates/driver-postgres",
    "crates/export-service",
    "crates/history-store",
    "crates/i18n",
    "crates/metadata-cache",
    "crates/secure-store",
    "crates/session-manager",
    "crates/slowlog-parser",
    "crates/ui-theme",
    "crates/ai-service",
    "crates/driver-sqlite",
]
resolver = "2"

[workspace.package]
version = "1.1.9"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
dirs = "6.0"
futures-util = "0.3"
eframe = "0.33"
getrandom = "0.3"
hex = "0.4"
egui = "0.33"
egui_dock = "0.18"
egui_extras = { version = "0.33", features = ["svg"] }
muda = "0.16"
mongodb = "3.2"
mysql_async = { version = "0.36", features = ["native-tls-tls"] }
parking_lot = "0.12"
raw-window-handle = "0.6"
postgres-native-tls = "0.5"
quick-xml = { version = "0.37", features = ["serialize"] }
native-tls = "0.2"
regex = "1"
regex-syntax = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }
rfd = "0.15"
rust_xlsxwriter = "0.84"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
winres = "0.1"

# 本地修补 egui：双击选词在长文本上是 O(N²)（0.33.3 的 ccursor_previous_word
# 对每个 word 调用 char_index_from_byte_index 从头扫描）。按 egui 0.35 的修复
# 改为累加字符位置，O(N)。升级到 0.35 会连带大量 API 变更，故用 patch 保留 0.33。
[patch.crates-io]
egui = { path = "third_party/egui" }
# 本地修补 epaint：显式设置 TextFormat.line_height 后 valign 失效（差值恒为 0），
# 字形贴行顶、行距全堆在行底。改为按字体行高 font_height 计算差值，让 valign 生效，
# 用于 SQL 编辑器行间距垂直居中。默认（未设 line_height）行为不变。
epaint = { path = "third_party/epaint" }

[profile.release]
lto = true
codegen-units = 1
strip = true
